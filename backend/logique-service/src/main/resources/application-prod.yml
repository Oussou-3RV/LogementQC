server:
  port: ${PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.bfrtfjhhrgdbsvmewjdf.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

file:
  upload-dir: /tmp/uploads

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app-annonces-logement.web.app}

logging:
  level:
    root: INFO
    com.annonce.logique_service: INFO