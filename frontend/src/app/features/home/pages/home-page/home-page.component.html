<div class="bg-gray-50 min-h-screen">
  
  <!-- Hero Section - Simple et épuré -->
  <div class="bg-white border-b border-gray-200">
    <div class="container mx-auto px-4 py-12 max-w-5xl">
      <h1 class="text-3xl text-center font-semibold text-gray-900 mb-3">
        Trouvez votre prochain logement
      </h1>
      <p class="text-gray-600 text-center mb-8">
        Parcourez les annonces disponibles dans votre région
      </p>
      
      <!-- Barre de recherche -->
      <app-search-bar (search)="onSearch($event)"></app-search-bar>
    </div>
  </div>

  <!-- Contenu principal -->
  <div class="container mx-auto px-4 py-8 max-w-7xl">
    
    <!-- Header avec compteur -->
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-xl font-medium text-gray-900">
        {{ annonces.length }} {{ annonces.length > 1 ? 'annonces' : 'annonce' }}
      </h2>
      <button 
        *ngIf="annonces.length > 0"
        (click)="loadAnnonces()"
        class="text-sm text-gray-600 hover:text-gray-900 flex items-center">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        Actualiser
      </button>
    </div>

    <!-- Loader -->
    <div *ngIf="loading" class="py-20 text-center">
      <div class="inline-block w-8 h-8 border-3 border-gray-300 border-t-gray-800 rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-600">Chargement...</p>
    </div>

    <!-- Liste des annonces -->
    <div *ngIf="!loading && annonces.length > 0">
      <app-annonce-list [annonces]="annonces" [loading]="loading"></app-annonce-list>
    </div>

    <!-- État vide -->
    <div *ngIf="!loading && annonces.length === 0" class="py-16 text-center">
      <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
      </svg>
      <h3 class="text-lg font-medium text-gray-900 mb-2">Aucune annonce trouvée</h3>
      <p class="text-gray-600 mb-6">Essayez de modifier vos critères de recherche</p>
      <button 
        (click)="loadAnnonces()"
        class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition-colors">
        Voir toutes les annonces
      </button>
    </div>

  </div>
</div>
