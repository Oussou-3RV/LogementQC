<mat-card 
  class="group h-full rounded-2xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-300 cursor-pointer border border-gray-100"
  (click)="viewDetails()"
>

  <!-- Image -->
  <div class="relative h-52 overflow-hidden">

    <img 
      [src]="getMainPhoto()" 
      [alt]="annonce.titre"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
    />

    <!-- Overlay gradient -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>

    <!-- Prix badge -->
    <div class="absolute bottom-3 left-3">
      <span class="bg-white/90 backdrop-blur px-3 py-1 rounded-full text-sm font-semibold shadow-md">
        {{ annonce.montantMensuel | currency:'CAD':'symbol':'1.0-0' }}
        <span class="text-gray-500 text-xs">/mois</span>
      </span>
    </div>

  </div>

  <!-- Contenu -->
  <mat-card-content class="bg-gray-100 p-5 space-y-3">

    <!-- Titre -->
    <h3 class="text-lg font-semibold text-black line-clamp-1 pt-3">
      {{ annonce.titre }}
    </h3>

    <!-- Localisation -->
    <div class="flex items-center text-gray-500 text-sm">
      <mat-icon class="text-base mr-1 text-gray-400">location_on</mat-icon>
      {{ annonce.adresse.ville }}, {{ annonce.adresse.province }}
    </div>

    <!-- Description -->
    <p class="text-black text-sm line-clamp-2">
      {{ annonce.descriptionCourte }}
    </p>

    <!-- Divider -->
    <div class="border-t pt-3 flex items-center justify-between">

      <div class="flex items-center text-xs text-gray-500">
        <mat-icon class="text-base mr-1">visibility</mat-icon>
        {{ annonce.nombreConsultations }} vues
      </div>

      <button
        mat-stroked-button
        color="primary"
        class="rounded-full"
        (click)="viewDetails(); $event.stopPropagation()"
      >
        Voir
      </button>

    </div>

  </mat-card-content>

</mat-card>
