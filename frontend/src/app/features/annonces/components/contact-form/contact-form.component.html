<mat-card>
    <mat-card-header class="bg-orange-600 ">
      <mat-card-title class="pb-3">
        <mat-icon class="align-middle mr-2">mail</mat-icon>
        Contacter l'annonceur
      </mat-card-title>
    </mat-card-header>
  
    <mat-card-content class="bg-white">
      <div *ngIf="!isAuthenticated" class="bg-yellow-50 border border-yellow-200 rounded  my-4">
        <div class="flex items-start">
          <mat-icon class="text-yellow-600 pr-6">info</mat-icon>
          <div>
            <p class="font-semibold text-yellow-800">Connexion requise</p>
            <p class="text-yellow-700 text-sm">
              Vous devez être connecté pour contacter l'annonceur.
              <a href="/auth/login" class="underline font-semibold">Connexion</a> ou
              <a href="/auth/register" class="underline font-semibold">Inscription</a>
            </p>
          </div>
        </div>
      </div>
  
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" *ngIf="isAuthenticated" >
        <!-- Sujet -->
        <mat-form-field class="w-full pt-3" >
          <mat-label>Sujet</mat-label>
          <input 
            matInput 
            formControlName="sujet"
            placeholder="Ex: Intéressé par votre logement"
          />
          <mat-error *ngIf="submitted && f['sujet'].errors?.['required']">
            Le sujet est obligatoire
          </mat-error>
          <mat-error *ngIf="submitted && f['sujet'].errors?.['minlength']">
            Le sujet doit contenir au moins 5 caractères
          </mat-error>
        </mat-form-field>
  
        <!-- Message -->
        <mat-form-field class="w-full" >
          <mat-label>Message</mat-label>
          <textarea 
            matInput 
            formControlName="contenu"
            rows="6"
            placeholder="Bonjour, je suis intéressé par votre annonce..."
          ></textarea>
          <mat-error *ngIf="submitted && f['contenu'].errors?.['required']">
            Le message est obligatoire
          </mat-error>
          <mat-error *ngIf="submitted && f['contenu'].errors?.['minlength']">
            Le message doit contenir au moins 20 caractères
          </mat-error>
        </mat-form-field>
  
        <!-- Bouton -->
        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          class="w-full"
        >
          <mat-icon>send</mat-icon>
          Envoyer le message
        </button>
      </form>
    </mat-card-content>
  </mat-card>
