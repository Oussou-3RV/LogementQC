<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 ">
    <mat-card class="max-w-md w-full mb-5">
      <mat-card-header class="flex flex-col items-center pb-4">
        <mat-icon class="text-6xl text-blue-600 mb-2">account_circle</mat-icon>
        <mat-card-title class="text-2xl font-bold text-center">Connexion</mat-card-title>
        <mat-card-subtitle class="text-center">Accédez à votre compte</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
          
          <!-- Email -->
          <mat-form-field class="w-full" >
            <mat-label>Email</mat-label>
            <input 
              matInput 
              type="email"
              formControlName="email"
              placeholder="votre@email.com"
            />
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="submitted && f['email'].errors?.['required']">
              L'email est obligatoire
            </mat-error>
            <mat-error *ngIf="submitted && f['email'].errors?.['email']">
              Veuillez entrer un email valide
            </mat-error>
          </mat-form-field>
  
          <!-- Password -->
          <mat-form-field class="w-full" >
            <mat-label>Mot de passe</mat-label>
            <input 
              matInput 
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="••••••••"
            />
            <mat-icon matPrefix>lock</mat-icon>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="hidePassword = !hidePassword"
            >
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="submitted && f['password'].errors?.['required']">
              Le mot de passe est obligatoire
            </mat-error>
            <mat-error *ngIf="submitted && f['password'].errors?.['minlength']">
              Le mot de passe doit contenir au moins 6 caractères
            </mat-error>
          </mat-form-field>
  
          <!-- Forgot Password -->
          <div class="text-right">
            <a 
              routerLink="/auth/forgot-password" 
              class="text-sm text-blue-600 hover:underline"
            >
              Mot de passe oublié ?
            </a>
          </div>
  
          <!-- Submit Button -->
          <button 
            mat-raised-button 
            color="primary" 
            type="submit"
            class="w-full h-12"
            [disabled]="loading"
          >
            <mat-spinner diameter="20" *ngIf="loading" class="inline-block mr-2"></mat-spinner>
            <span *ngIf="!loading">Se connecter</span>
            <span *ngIf="loading">Connexion en cours...</span>
          </button>
  
          <!-- Divider -->
          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-gray-500">Nouveau sur la plateforme ?</span>
            </div>
          </div>
  
          <!-- Register Link -->
          <button 
            mat-stroked-button 
            type="button"
            class="w-full h-12"
            routerLink="/auth/register"
          >
            Créer un compte
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
