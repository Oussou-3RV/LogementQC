<div class="space-y-4">
  
    <!-- Zone de sélection -->
    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors">
      <input 
        type="file"
        #fileInput
        (change)="onFileSelected($event)"
        accept="image/*"
        multiple
        class="hidden"
        id="file-input">
      
      <label for="file-input" class="cursor-pointer">
        <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <p class="text-slate-700 font-medium mb-2">Cliquez pour sélectionner des images</p>
        <p class="text-sm text-slate-500">PNG, JPG, GIF (max. 5MB par image)</p>
        <p class="text-xs text-slate-400 mt-2">Maximum {{ maxFiles }} images</p>
      </label>
    </div>
  
    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-3">
      <p class="text-sm text-red-800">{{ errorMessage }}</p>
    </div>
  
    <!-- Preview des images -->
    <div *ngIf="previewUrls.length > 0" class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div *ngFor="let url of previewUrls; let i = index" class="relative group">
        <img 
          [src]="url" 
          alt="Preview" 
          class="w-full h-40 object-cover rounded-lg border border-gray-200">
        
        <!-- Bouton supprimer -->
        <button 
          type="button"
          (click)="removeImage(i)"
          class="absolute top-2 right-2 w-8 h-8 bg-red-600 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center hover:bg-red-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
  
        <!-- Numéro de l'image -->
        <div class="absolute bottom-2 left-2 bg-slate-800 bg-opacity-75 text-white text-xs px-2 py-1 rounded">
          Image {{ i + 1 }}
        </div>
      </div>
    </div>
  
    <!-- Bouton Upload -->
    <div *ngIf="selectedFiles.length > 0" class="flex justify-end">
      <button 
        type="button"
        (click)="uploadImages()"
        [disabled]="uploading"
        class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center">
        <svg *ngIf="uploading" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span *ngIf="!uploading">Télécharger {{ selectedFiles.length }} image(s)</span>
        <span *ngIf="uploading">Téléchargement...</span>
      </button>
    </div>
  
  </div>
